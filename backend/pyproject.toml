[project]
name = "rag-pdf-qa-backend"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sentence-transformers",
    "chromadb",
    "sqlalchemy",
    "pdfplumber",
    "python-multipart",
    "requests",
    "pydantic-settings",
    "email-validator",
    "bcrypt",
    "pyjwt",
    "alembic",
    "python-docx",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is idiomatic FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]